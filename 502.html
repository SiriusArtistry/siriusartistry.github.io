<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>502 Bad Gateway</title>
        <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>
        <div class="content-wrapper">
                <div class="v-center">
                    <div class="main-content">
                        <p>
                            <span>Whoops</span>
                        <p>
                            This site is down (for now)... <a href="https://siriusartistry.io" onclick="goBackOrClose(event)"> head back</a>.

                            <script>
                            function goBackOrClose(e) {
                                // If history exists, go back
                                if (history.length > 1) {
                                    e.preventDefault();
                                    history.back();
                                } 
                                // If no history, try closing (works only if opened in new tab/window)
                                else {
                                    window.close();
                                    // If window.close() fails (e.g., direct access), let the default href redirect occur
                                }
                            }
                            </script>
                        </p>

                    </div>
                </div>
            </div>
    </body>
</html>
